# The parent compositor for a monitor-less box. Started by Scripts/pi-session.sh.
#
# wlroots' headless backend makes a virtual output that still renders on the real GPU
# (/dev/dri/renderD128 — V3D on a Pi 5), and grim captures it. That distinction matters:
# Xvfb and Xephyr paint nothing, because GPUI must present into an X drawable through
# DRI3 and they have no path for it. Here the client hands a wl_buffer to the compositor
# and the compositor composites it. Same absent monitor, opposite outcome.

output HEADLESS-1 mode 1920x1080@60Hz

default_border none
default_floating_border none
focus_follows_mouse no
# no bar, no wallpaper: every pixel on the output belongs to whatever is under test
bar {
    mode invisible
}

# Publish the display name. sway does NOT honour WAYLAND_DISPLAY as "name your socket this" —
# wlroots calls wl_display_add_socket_auto and takes the first free wayland-N — so the only way to
# learn the parent's socket is to have the parent say so. Scripts/pi-session.sh reads this file;
# without it, a caller has to guess, and guessing wayland-1 is exactly how a leaked nested
# compositor got mistaken for the parent on 2026-08-17.
exec sh -c 'printf "%s\n" "$WAYLAND_DISPLAY" > /tmp/tiller-parent.display'
