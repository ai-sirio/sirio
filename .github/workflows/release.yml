name: Release

# The Stable channel: built from a `v*.*.*` tag, published as a GitHub release
# plus `stable.json` on the manifest host (spec §3.3, §9). The build itself
# lives in build-release.yml, shared with the nightly; this file decides only
# what a stable release *is*: its version comes from the tag and must equal
# rust/Cargo.toml (§3.2), its notes are hand-written (§7.4), and it publishes
# only on a real tag push.
#
# NOT YET VERIFIED on macOS -- see the header of build-release.yml. Do not push
# a `v*.*.*` tag until `Scripts/ci.sh` prints `CI OK` on a real Mac. Use the
# manual trigger to validate a branch with a tag input: it builds everything
# and publishes nothing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate (for example v0.5.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Everything that can refuse a release cheaply, before the macOS gate spends
  # an hour: ordering steps by increasing cost of failure means a version
  # mismatch costs two seconds here instead of an Apple round-trip after
  # notarization.
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Spec §9.2: the manifest derives from Cargo.toml and the tag derives
      # from the manifest, never the other way round. A tag that disagrees is
      # refused, not reconciled.
      - name: Check version matches tag
        id: version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(Scripts/check-release-version.sh "$TAG_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Spec §7.4: what changed is written by hand, one file per version,
      # seeded from `Scripts/generate-changelog.sh v<version>` and edited down
      # to what a user should read. The text rides inside the manifest, so it
      # costs no extra request and needs no public repo. A release without its
      # notes file is refused here, before anything is built: a manifest with
      # empty notes would render nothing in the update prompt, and nobody
      # would notice until a user asked what they had just installed.
      - name: Require hand-written release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="docs/release-notes/${VERSION}.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "error: no hand-written release notes at $NOTES_FILE; seed them with Scripts/generate-changelog.sh and commit before tagging" >&2
            exit 1
          fi
          # `$(cat ...)` strips trailing newlines and printf adds exactly one
          # back, so the closing delimiter always sits on its own line even
          # when the file was saved without a final newline.
          {
            echo "notes<<SIRIO_NOTES_EOF"
            printf '%s\n' "$(cat "$NOTES_FILE")"
            echo "SIRIO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # The called workflow cannot hold more than the caller grants: `publish`
    # inside it needs contents: write for the release and the gh-pages push,
    # and pages: read to learn whether the manifest is served. The build jobs
    # in there scope themselves back down to contents: read.
    permissions:
      contents: write
      pages: read
    uses: ./.github/workflows/build-release.yml
    with:
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ inputs.tag || github.ref_name }}
      notes: ${{ needs.prepare.outputs.notes }}
      prerelease: false
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
