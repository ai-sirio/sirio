name: Release

# This workflow used to archive, codesign, notarize, DMG-package, and publish the Swift
# macOS app on every version tag (keychain import, Developer ID codesigning, App Store
# Connect notarization, Sparkle appcast generation, gh release create with a DMG asset).
# That whole pipeline assumed a macOS app to sign and distribute, which no longer exists --
# the Swift/Xcode project was removed once the Rust/gpui Linux port covered the inventory.
#
# A faithful *retarget* of a release pipeline needs a release process to retarget it at:
# where binaries get published, whether they're signed, what a "release" artifact even is
# for this port. None of that has been specified anywhere in this repo (docs/linux-rewrite/
# does not describe one), so inventing one here would mean shipping a packaging/distribution
# design nobody asked for under the same filename as a real release workflow. Rather than
# do that, this workflow is reduced to what it can honestly claim on a tag push: building
# and testing the Rust workspace. It is not a release job anymore, and it does not create a
# GitHub release, an artifact, or a binary -- it exists so pushing a version tag still gets
# the same verification as everything else, nothing more.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build --workspace
        working-directory: rust
        run: cargo build --workspace

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace
