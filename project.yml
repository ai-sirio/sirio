name: Tiller
options:
  bundleIdPrefix: dev.tiller
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "5VF5BV7C9Q"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  TillerCore:
    path: Packages/TillerCore
  TillerWorkspace:
    path: Packages/TillerWorkspace
  TillerTerminal:
    path: Packages/TillerTerminal
  TillerPersistence:
    path: Packages/TillerPersistence
  TillerControl:
    path: Packages/TillerControl
  TillerGit:
    path: Packages/TillerGit
  TillerAgents:
    path: Packages/TillerAgents
  TillerACP:
    path: Packages/TillerACP
  TillerCode:
    path: Packages/TillerCode
  TillerBrowser:
    path: Packages/TillerBrowser
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor.git
    from: 0.15.2
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.8.0
  Inject:
    url: https://github.com/krzysztofzablocki/Inject.git
    from: 1.5.2
targets:
  Tiller:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: skills/tiller/SKILL.md
        buildPhase: resources
    settings:
      configs:
        Debug:
          # Required for Xcode Previews. The "Embed tillerctl" postbuild script
          # explicitly signs Tiller.debug.dylib before re-signing the bundle,
          # so the bundle seal stays valid.
          ENABLE_DEBUG_DYLIB: YES
          # InjectionNext hot-reload PoC: -interposable lets Injection swap
          # function implementations at runtime; EMIT_FRONTEND_COMMAND_LINES
          # is required by InjectionNext on Xcode 16.3+/26.x to locate the
          # per-file compile command it needs to recompile+inject a save.
          OTHER_LDFLAGS: -Xlinker -interposable
          EMIT_FRONTEND_COMMAND_LINES: YES
          # Project never defined DEBUG previously; Inject's client-side
          # connection code is gated behind #if DEBUG, so without this it
          # silently never dials InjectionNext's socket.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # ENABLE_HARDENED_RUNTIME blocks dlopen of InjectionNext's
          # macOSInjection.bundle (not Apple-signed) without this exception.
          CODE_SIGN_ENTITLEMENTS: App/InjectDebug.entitlements
          EMIT_FRONTEND_COMMAND_LINES: YES
    dependencies:
      - package: TillerCore
      - package: TillerWorkspace
      - package: TillerTerminal
      - package: TillerPersistence
      - package: TillerControl
      - package: TillerAgents
      - package: TillerACP
      - package: TillerCode
      - package: TillerBrowser
      - package: CodeEditSourceEditor
      - package: MarkdownUI
      - package: TillerGit
      - package: Sparkle
      - package: Inject
    info:
      path: App/Info.plist
      properties:
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "0.5.2"
        # Sparkle confronta sparkle:version = build version: deve crescere a
        # ogni release. Regola: identica a CFBundleShortVersionString.
        CFBundleVersion: "0.5.2"
        SUFeedURL: https://github.com/e-palmisano/tiller/releases/latest/download/appcast.xml
        SUPublicEDKey: "vAZjNGZzdhdoPR+awpWhypVQoP9ttVzFOSSm9pV/Wio="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        # UTType(exportedAs:) in RowReorder.swift only resolves if the type is
        # declared here — an undeclared UTI makes every row drop bounce.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: it.tiller.row-drag
            UTTypeDescription: Tiller Row
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
    postbuildScripts:
      - name: Embed tillerctl
        script: |
          set -e
          swift build --package-path "$SRCROOT/Packages/TillerControl" --product tillerctl -c "$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          cp "$SRCROOT/Packages/TillerControl/.build/$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')/tillerctl" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/tillerctl"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/tillerctl"
            HAS_XCTEST=0
            for TEST_BUNDLE in "$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/PlugIns/"*.xctest; do
              # During build-for-testing the xctest is embedded by the test
              # target in parallel and may be mid-copy here; sign best-effort
              # and let the test action re-sign host + bundle afterwards.
              [ -d "$TEST_BUNDLE" ] || continue
              HAS_XCTEST=1
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TEST_BUNDLE" 2>/dev/null || true
            done
            for DYLIB in "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/"*.dylib; do
              [ -f "$DYLIB" ] && codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DYLIB"
            done
            if [ "$HAS_XCTEST" = "1" ]; then
              # Test build: the wrapper seal is redone by the test action once
              # the xctest embed completes — a failure here is only the race.
              codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$WRAPPER_NAME" || true
            else
              codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
            fi
          fi
        basedOnDependencyAnalysis: false
  TillerTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: AppTests
    dependencies:
      # Only the host app. Listing TillerCode / CodeEditSourceEditor here too would
      # make them multi-consumer products, which pushes SwiftPM to build them as
      # dynamic PackageFrameworks — and several packages in the CodeEdit graph rely
      # on transitive symbol leakage that only survives static linking.
      - target: Tiller
schemes:
  Tiller:
    build:
      targets:
        Tiller: all
        TillerTests: [test]
    test:
      targets:
        - TillerTests
