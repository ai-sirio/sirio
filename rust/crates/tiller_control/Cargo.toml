[package]
name = "tiller_control"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately NOT part of the workspace yet (the integrator adds it to
# rust/Cargo.toml's members). Version/edition are hardcoded on purpose, and
# there is no `[workspace]` table here: a package that declares its own
# workspace root stops being a real member once it is added to the parent's
# members list. Until the member entry lands, build and test from a copy of
# this directory outside the workspace tree (cargo inside the tree errors
# with "current package believes it's in a workspace when it's not").

[dependencies]
# JSON framing for the line-delimited control protocol. Pinned to the
# versions present in the local cargo registry (offline builds work).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One libc call (getuid) for the socket ownership sanity check.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Raw named-pipe transport (CreateNamedPipeW/CreateFileW plus the SDDL and
# token APIs behind its security parity). Same windows-sys version the
# workspace lockfile already carries via gpui, so offline builds keep
# resolving from the local registry.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1"
tiller_acp = { path = "../tiller_acp" }
tiller_persistence = { path = "../tiller_persistence" }

[[bin]]
name = "tillerctl"
path = "src/bin/tillerctl.rs"
