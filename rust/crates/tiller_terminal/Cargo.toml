[package]
name = "tiller_terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
tiller_theme.workspace = true
tiller_project.workspace = true
anyhow.workspace = true
futures = "0.3"
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
parking_lot = "0.12"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# wayland/x11 are Linux-only gpui/gpui_platform windowing backends; see the
# long comment above the workspace-level `gpui` entry in the root Cargo.toml
# for why this lives here per-crate rather than on the workspace dependency
# itself.
gpui = { workspace = true, features = ["wayland", "x11"] }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# PROTOTYPE ONLY -- branch `prototype/ghostty-pane`, issue #33.
# These exist for `examples/prototype_ghostty_pane.rs` and must not reach the
# real crate's dependency graph. Deliberately dev-dependencies: an example can
# use them, `tiller_terminal` itself cannot.
libghostty-vt = "0.2.1"
portable-pty = "0.9"
