query ChangeRequestActionContext($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    viewerPermission mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed autoMergeAllowed deleteBranchOnMerge
    pullRequest(number: $number) {
      id state isDraft locked headRefOid headRefName isCrossRepository
      viewerCanUpdate viewerCanClose viewerCanReopen viewerDidAuthor viewerCanEnableAutoMerge
      pendingReview: reviews(states: [PENDING], first: 1) { nodes { id comments { totalCount } } }
      mergeStateStatus reviewDecision
      autoMergeRequest { mergeMethod }
      commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
      reviewRequests(first: 50) { nodes { requestedReviewer { __typename ... on Node { id } } } }
    }
  }
}
