query MergeRequestHeader($fullPath: ID!, $iid: String!) {
  project(fullPath: $fullPath) {
    mergeRequest(iid: $iid) {
      headPipeline { userPermissions { updatePipeline } }
      ...MergeRequestSummary
      id
      discussionLocked
      userPermissions { canApprove canMerge createNote updateMergeRequest }
      diffHeadSha detailedMergeStatus squashOnMerge squashReadOnly autoMergeEnabled availableAutoMergeStrategies shouldRemoveSourceBranch
      labels { nodes { id title color } }
      description
      diffRefs { baseSha headSha startSha }
      diffStatsSummary { additions deletions fileCount }
      commitCount
      notes(last: 100) {
        pageInfo { hasPreviousPage }
        nodes { id userPermissions { adminNote } author { username } body createdAt system position { filePath newLine oldLine } }
      }
    }
  }
}
