query MergeRequestActionContext($fullPath: ID!, $iid: String!) {
  project(fullPath: $fullPath) {
    mergeRequest(iid: $iid) {
      id state draft discussionLocked diffHeadSha
      detailedMergeStatus squashOnMerge squashReadOnly autoMergeEnabled availableAutoMergeStrategies shouldRemoveSourceBranch
      userPermissions { canApprove canMerge createNote updateMergeRequest }
      reviewers { nodes { username } }
    }
  }
}
