[package]
name = "sirio_host_client"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
libc = "0.2"

# Win32_Security is needed by `CreateJobObjectW` (its first parameter is a
# SECURITY_ATTRIBUTES pointer); the probe's `job` role calls it. Same
# windows-sys version the workspace lockfile already carries.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
