[package]
name = "sirio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "sirio"
path = "src/main.rs"

[features]
# Measurement build only; runtime export also requires both trace paths.
perf-native = ["gpui/profiler", "dep:perf_scheduler"]

[dependencies]
perf_scheduler = { package = "bezel-zed-scheduler", version = "=0.3.8", optional = true }
sirio_perf = { path = "../sirio_perf" }
notify = "8"
# Only for `bezel::ui::register_fonts`: the Geist faces the theme names.
bezel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
sirio_theme.workspace = true
sirio_ui.workspace = true
sirio_terminal.workspace = true
sirio_agents.workspace = true
sirio_registry = { workspace = true }
sirio_acp.workspace = true
sirio_project.workspace = true
sirio_persistence.workspace = true
sirio_activity.workspace = true
sirio_control.workspace = true
sirio_release.workspace = true
sirio_update.workspace = true
sirio_apply.workspace = true
sirio_git.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The window icon (`WindowOptions.icon`): decoded once at startup from the
# embedded PNG. Same crate and version family gpui itself uses, so the
# `Arc<RgbaImage>` type is the same instance gpui_linux reads into
# `_NET_WM_ICON`. `png` is the only format the asset set needs.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
# Compiles `build.rs`'s generated `1 ICON "app-icon.ico"` resource with the
# MSVC `rc.exe`. The gpui Windows backend loads resource ID 1 once via
# `LoadImageW` and registers it as the window-class icon (`WNDCLASS.hIcon`);
# it has no per-window icon API, so this is the whole Windows story.
embed-resource = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# Shell_NotifyIcon and its private message-only window for the native Windows
# tray roster. Same windows-sys version already used by sirio_control and
# present in the workspace lockfile, so this adds no external dependency.
# Win32_Graphics_Gdi is required because windows-sys gates WNDCLASSW behind
# the HBRUSH field in that feature, although the tray does not draw with GDI.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSStatusItem and its menu for the native macOS tray roster. Same objc2
# family and versions gpui itself links, so these resolve to the one copy
# already in the workspace lockfile — an `NSMenu` here is the same type
# gpui's own AppKit code sees, and no second Objective-C runtime binding
# enters the build.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
    "NSButton",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.2.2", features = ["NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
# F-CTRL-BROWSER-05: browser.wait pumps the same process-global GTK main
# loop sirio_ui's BrowserSurface drives from its 16ms timer, so a bounded
# wait here can make WebKit's async load actually progress instead of
# spinning uselessly until timeout.
gtk = "0.18.2"
# F-USE-04/F-USE-05/F-WIN-08: the StatusNotifierItem tray (`src/tray.rs`).
# "blocking" runs the D-Bus service on its own OS thread with a synchronous
# `spawn()`/`Handle::update()`, so it needs no tokio runtime wired through
# GPUI's own executor -- default features already pull tokio in just to
# drive that background thread's zbus connection, which is what "blocking"
# builds on top of.
ksni = { version = "0.3.6", features = ["blocking"] }
# wayland/x11 are Linux-only gpui/gpui_platform windowing backends; see the
# long comment above the workspace-level `gpui` entry in the root Cargo.toml
# for why this lives here per-crate rather than on the workspace dependency
# itself.
gpui = { workspace = true, features = ["wayland", "x11"] }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
# For tests that hand-corrupt a database (e.g. bumping user_version).
rusqlite = { version = "0.31", features = ["bundled"] }
# For the headless window tests (session restore survival).
gpui = { workspace = true, features = ["test-support"] }
