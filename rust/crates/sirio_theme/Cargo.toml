[package]
name = "sirio_theme"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
anyhow.workspace = true
# The colour tokens themselves: `ThemeColors::for_appearance` reads
# `bezel::theme::Theme` rather than carrying its own palette.
bezel.workspace = true
# Font discovery for the runtime-resolved code family: fontdb is the same
# database gpui's Linux text system loads, so the generic "monospace" answer
# here is the system's own (fontconfig's alias), not a hard-coded guess.
# Already in the dependency tree via gpui_wgpu -> cosmic-text; no new
# transitive dependencies.
fontdb = "0.23"

[dev-dependencies]
# Pins the bundled terminal faces to the family name the candidate list
# leads with, and checks their Nerd Font glyph coverage. The parser fontdb
# itself is built on, so no new transitive dependency.
ttf-parser = "0.25"

# The XDG desktop portal's color-scheme query. Same crate gpui_linux uses for
# the same purpose; declared here (rather than the workspace manifest) because
# only this crate consumes it. Linux-only: macOS resolves appearance
# synchronously through NSAppearance and never needs the portal.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
# wayland/x11 are Linux-only gpui windowing backends; see the long comment
# above the workspace-level `gpui` entry in the root Cargo.toml for why this
# lives here per-crate rather than on the workspace dependency itself.
gpui = { workspace = true, features = ["wayland", "x11"] }
