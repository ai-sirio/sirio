[package]
name = "sirio_control"
# Ships beside `sirio`, so its reported version must stay in sync.
version.workspace = true
edition = "2024"
publish = false

[dependencies]
# JSON framing for the line-delimited control protocol. Pinned to the
# versions present in the local cargo registry (offline builds work).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One libc call (getuid) for the socket ownership sanity check.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# #246: ConPTY for control-owned panes. Same version sirio_terminal pins for
# the UI's own panes -- this crate cannot depend on that one (the layering in
# CLAUDE.md puts them side by side), so it opens its own PTY.
portable-pty = "0.9"
# Raw named-pipe transport (CreateNamedPipeW/CreateFileW plus the SDDL and
# token APIs behind its security parity). Same windows-sys version the
# workspace lockfile already carries via gpui, so offline builds keep
# resolving from the local registry.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = "1"
sirio_acp = { path = "../sirio_acp" }
sirio_persistence = { path = "../sirio_persistence" }

[[bin]]
name = "sirioctl"
path = "src/bin/sirioctl.rs"
