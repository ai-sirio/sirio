[package]
name = "sirio_control"
# Ships beside `sirio`, so its reported version must stay in sync.
version.workspace = true
edition = "2024"
publish = false

[dependencies]
# JSON framing for the line-delimited control protocol. Pinned to the
# versions present in the local cargo registry (offline builds work).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Process-group and reaping calls for control-owned panes.
libc = "0.2"
# The local transport (unix socket / Windows named pipe) and its ownership
# checks live in their own crate, shared with the detached host.
sirio_ipc = { path = "../sirio_ipc" }

[target.'cfg(windows)'.dependencies]
# #246: ConPTY for control-owned panes. Same version sirio_terminal pins for
# the UI's own panes -- this crate cannot depend on that one (the layering in
# CLAUDE.md puts them side by side), so it opens its own PTY.
portable-pty = "0.9"

[dev-dependencies]
anyhow = "1"
sirio_acp = { path = "../sirio_acp" }
sirio_persistence = { path = "../sirio_persistence" }

[[bin]]
name = "sirioctl"
path = "src/bin/sirioctl.rs"
