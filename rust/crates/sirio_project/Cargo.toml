[package]
name = "sirio_project"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Pure domain model + git discovery. The public API is plain value types and
# std::process-based git shell-out, so any crate (UI, terminal, CLI) can build
# on it without inheriting GPUI. The non-std dependencies are libc, for
# killing a timed-out git invocation's whole process group (git can leave
# grandchildren holding the output pipes; process-group signals are not
# exposed by std — Zed's own process wrapper does the same), and sirio_env,
# which starts that git in the user's environment rather than the launcher's.
[dependencies]
sirio_env = { path = "../sirio_env" }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
