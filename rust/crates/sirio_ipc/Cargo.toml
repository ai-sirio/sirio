[package]
name = "sirio_ipc"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
# getuid/getsockopt for the socket ownership checks, and proc_pidinfo for a
# process's start time on macOS.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Raw named-pipe transport (CreateNamedPipeW/CreateFileW plus the SDDL and
# token APIs behind its security parity) and GetProcessTimes for a process's
# start time. Same windows-sys version the workspace lockfile already carries
# via gpui, so offline builds keep resolving from the local registry.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
