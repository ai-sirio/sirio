[package]
name = "sirio_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sirio_perf = { path = "../sirio_perf" }
gpui.workspace = true
gpui_platform.workspace = true
bezel = { workspace = true }
bezel-markdown.workspace = true
bezel-editor.workspace = true
bezel-syntax.workspace = true
anyhow.workspace = true
sirio_theme.workspace = true
sirio_git.workspace = true
sirio_acp.workspace = true
sirio_markdown.workspace = true
sirio_project.workspace = true
sirio_agents.workspace = true
sirio_registry = { workspace = true }
sirio_persistence.workspace = true
sirio_usage = { path = "../sirio_usage" }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Same crates gpui uses, at the same versions, so a `RenderImage` can be
# built here without a second copy of the types.
image = { version = "0.25.10", default-features = false }
smallvec.workspace = true
# F-PRJ-16: grapheme-cluster-correct single-emoji validation. Already
# resolved transitively at this version; promoted to a direct dependency.
unicode-segmentation = "1.13"
raw-window-handle = "0.6.2"
wry = "0.56.1"

[target.'cfg(target_os = "macos")'.dependencies]
# SF Symbol rasterization (NSImage -> bitmap); macOS-only, so the rest of
# the crate keeps compiling for non-Apple targets.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSImage",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSData",
    "NSGeometry",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# #369 (Ctrl+L residual): `BrowserSurface::focus_address_bar` must steal Win32
# thread focus from the WebView2 child, not just `SetFocus` it. Same
# windows-sys version already used by `sirio`/`sirio_control`, so this adds no
# new external dependency, only a new edge to the locked 0.61 line.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# #369 follow-up: host chords pressed while the page holds Win32 focus never
# reach gpui (WebView2 consumes its accelerators), so the surface forwards
# them from `ICoreWebView2Controller::add_AcceleratorKeyPressed`. Same 0.38
# line `wry` itself builds against — no new external dependency, only an edge
# to the locked version.
webview2-com = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
# B-02 browser surface: WebKitGTK in a native X11 child window. GTK/WebKit
# development headers are an explicit Linux build prerequisite; no custom
# PKG_CONFIG_PATH or repository-local sysroot is supported.
gtk = "0.18.2"
# wayland/x11 are Linux-only gpui/gpui_platform windowing backends; see the
# long comment above the workspace-level `gpui` entry in the root Cargo.toml
# for why this lives here per-crate rather than on the workspace dependency
# itself.
gpui = { workspace = true, features = ["wayland", "x11"] }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Examples are dev targets; keep registry parsing out of the shipped binary.
serde_json = "1"

[[bin]]
name = "changes_preview"
path = "src/bin/changes_preview.rs"
