[package]
name = "sirio_apply"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The hand-off contract: this crate consumes a `VerifiedUpdate` and applies
# the staged artifact; it never downloads or verifies anything itself.
sirio_update.workspace = true
thiserror = "2"

# Examples only (`examples/update_probe.rs`): the live end-to-end probe builds
# the same `AcceptedKeys` the app builds, which is `sirio_release`'s type. It
# stays a dev-dependency so the crate boundary above -- apply consumes a
# `VerifiedUpdate` and nothing else -- is unchanged for anything that ships.
[dev-dependencies]
sirio_release.workspace = true