[package]
name = "sirio_persistence"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately NOT part of the workspace yet (the integrator adds it to
# rust/Cargo.toml's members). Version/edition are hardcoded on purpose, and
# there is no `[workspace]` table here: a package that declares its own
# workspace root stops being a real member once it is added to the parent's
# members list. To build and test before integration, copy this directory
# outside the workspace (or have the member added) — `cargo test` inside the
# tree errors with "current package believes it's in a workspace when it's
# not".

[dependencies]
sirio_perf = { path = "../sirio_perf" }
# Bundled SQLite so no system library is required. 0.31 is pinned to the
# version present in the local cargo registry.
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
