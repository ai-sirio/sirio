[package]
name = "sirio_terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sirio_perf = { path = "../sirio_perf" }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
sirio_theme.workspace = true
sirio_project.workspace = true
anyhow.workspace = true
futures = "0.3"
# #301 (R2.2): the pane decodes Kitty image pixels with the same `image`
# 0.25.10 the `sirio` binary already links (R2.1 — no second PNG stack;
# libghostty-vt's own optional `png` feature stays off).
image = { version = "0.25.10", default-features = false, features = ["png"] }
libghostty-vt = "0.2.1"
portable-pty = "0.9"
parking_lot = "0.12"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# wayland/x11 are Linux-only gpui/gpui_platform windowing backends; see the
# long comment above the workspace-level `gpui` entry in the root Cargo.toml
# for why this lives here per-crate rather than on the workspace dependency
# itself.
gpui = { workspace = true, features = ["wayland", "x11"] }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
