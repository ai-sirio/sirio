[package]
name = "tiller_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
tiller_theme.workspace = true
tiller_git.workspace = true
tiller_acp.workspace = true
tiller_markdown.workspace = true
tiller_project.workspace = true
tiller_usage = { path = "../tiller_usage" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Same crates gpui uses, at the same versions, so a `RenderImage` can be
# built here without a second copy of the types.
image = { version = "0.25.10", default-features = false }
smallvec.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# SF Symbol rasterization (NSImage -> bitmap); macOS-only, so the rest of
# the crate keeps compiling for non-Apple targets.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSImage",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSData",
    "NSGeometry",
    "objc2-core-foundation",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
