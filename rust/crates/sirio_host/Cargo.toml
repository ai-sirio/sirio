[package]
name = "sirio_host"
version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "sirio-host"
path = "src/main.rs"

[dependencies]
sirio_ipc = { path = "../sirio_ipc" }
sirio_host_protocol = { path = "../sirio_host_protocol" }
serde = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# signal(SIGHUP, SIG_IGN): the host outlives the terminal that started it.
libc = "0.2"
