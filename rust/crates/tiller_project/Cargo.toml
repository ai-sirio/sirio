[package]
name = "tiller_project"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Pure domain model + git discovery. The public API is plain value types and
# std::process-based git shell-out, so any crate (UI, terminal, CLI) can build
# on it without inheriting GPUI. The one non-std dependency is libc: killing
# a timed-out git invocation must kill its whole process group (git can leave
# grandchildren holding the output pipes), and process-group signals are not
# exposed by std — Zed's own process wrapper does the same.
[dependencies]
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
