[package]
name = "sirio_chat"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-io = "2"
async-channel = "2"
async-process = "2"
anyhow.workspace = true
futures = "0.3"
serde_json = "1"
sirio_acp.workspace = true
sirio_chat_child = { path = "../sirio_chat_child" }
sirio_chat_vocab = { path = "../sirio_chat_vocab" }
sirio_claude = { path = "../sirio_claude" }
sirio_env = { path = "../sirio_env" }
sirio_mcp_apps = { path = "../sirio_mcp_apps" }
sirio_persistence = { path = "../sirio_persistence" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
