[workspace]
resolver = "2"
# vendor/gpui_linux and vendor/gpui_platform are local `[patch]` overrides for the pinned gpui
# git dependency (F-CORE-FILE-03A), not workspace members -- each carries its own `[workspace]`
# table so `cargo test --manifest-path rust/vendor/gpui_linux/Cargo.toml` (etc.) can run their
# tests standalone; excluded here so `cargo build/test --workspace` does not also try to treat
# them as members (which conflicts with their own `[workspace]` tables).
exclude = ["vendor/gpui_linux", "vendor/gpui_platform"]
members = [
    "crates/tiller",
    "crates/tiller_theme",
    "crates/tiller_ui",
    "crates/tiller_terminal",
    "crates/tiller_acp",
    "crates/tiller_project",
    "crates/tiller_git",
    "crates/tiller_persistence",
    "crates/tiller_agents",
    "crates/tiller_control",
    "crates/tiller_activity",
    "crates/tiller_markdown",
    "crates/tiller_usage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# GPUI used to be an absolute path into a zed checkout on one particular Mac, which meant the
# workspace failed to resolve — not to build, to *resolve* — anywhere else, taking all thirteen
# crates down with it even though only four of them touch GPUI. Now that Tiller targets Linux as
# well, a pinned git rev is the only form that works on both machines with no local checkout.
# Bump the rev deliberately: it is the single knob that moves the GPUI API under the whole UI.
# gpui's own defaults are ["font-kit", "wayland", "x11", "windows-manifest"], so
# `default-features = false` silently removed the two that decide whether this program can put a
# window on a Linux screen. gpui::guess_compositor() is compiled against *gpui's* features, not
# gpui_platform's: with them off it reads neither $DISPLAY nor $WAYLAND_DISPLAY, returns
# "Headless", and the app runs a perfectly healthy event loop forever without a window. It
# compiles, starts, logs, exits cleanly — and renders nothing.
#
# "wayland" and "x11" are Linux-only windowing backends -- meaningless on macOS/Windows, whose
# own backends live in gpui_macos and inside gpui_platform's own
# `[target.'cfg(target_os = "windows")']` section -- so a workspace dependency (which cannot
# itself be target-conditional; Cargo has no `[target...workspace.dependencies]` table) cannot
# pin them unconditionally without breaking non-Linux resolution. They are re-added, Linux-only,
# by every crate that depends on gpui/gpui_platform, via a `[target.'cfg(target_os = "linux")'.
# dependencies]` section of the form `gpui = { workspace = true, features = ["wayland", "x11"] }`
# -- Cargo unifies features requested for the same dependency across a package's unconditional
# and target-specific dependency tables (verified: a `[dependencies]` entry with
# `default-features = false` plus a `[target.cfg(...).dependencies]` entry adding a feature for
# the *same* crate does turn that feature on for matching targets), so this is additive, not a
# second declaration. Net effect for `x86_64-unknown-linux-gnu`: byte-for-byte the same feature
# set as before this change. gpui_platform below must enable its own wayland/x11 copies the same
# way, since they are separate switches from gpui's.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", default-features = false }
# "font-kit" is not Linux-specific (unlike wayland/x11 above) so it stays unconditional here,
# matching gpui_platform's pre-portability-wave feature set on every platform.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", default-features = false, features = ["font-kit"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"

tiller_theme = { path = "crates/tiller_theme" }
tiller_ui = { path = "crates/tiller_ui" }
tiller_terminal = { path = "crates/tiller_terminal" }
tiller_acp = { path = "crates/tiller_acp" }
tiller_project = { path = "crates/tiller_project" }
tiller_git = { path = "crates/tiller_git" }
tiller_persistence = { path = "crates/tiller_persistence" }
tiller_agents = { path = "crates/tiller_agents" }
tiller_control = { path = "crates/tiller_control" }
tiller_activity = { path = "crates/tiller_activity" }
tiller_markdown = { path = "crates/tiller_markdown" }
tiller_usage = { path = "crates/tiller_usage" }

# Local override for F-CORE-FILE-03A: upstream `gpui_linux`'s wl_data_device `Drop` handler
# bails out silently (no `finish()`/`destroy()`, no error, no event delivered to the app) when
# the async `Enter` pipe-read that resolves the dragged paths has not yet completed -- which a
# provider slower than ~150ms reliably triggers, discarding a real XDND drop with no trace. See
# rust/vendor/README.md and docs/linux-rewrite/tasks/P133-gpui-xdnd-slow-provider-race.md.
# `gpui_platform` is patched alongside it only because its own `gpui_linux` dependency is a path
# dependency inside the zed checkout (a different source than this `[patch]` targets), not
# because gpui_platform's own code changed -- see rust/vendor/gpui_platform/Cargo.toml.
[patch."https://github.com/zed-industries/zed"]
gpui_linux = { path = "vendor/gpui_linux" }
gpui_platform = { path = "vendor/gpui_platform" }

[profile.dev]
# Keep dev links and debug-info I/O light; remove this line when full debug info is needed.
debug = "line-tables-only"
split-debuginfo = "unpacked"
