[workspace]
resolver = "2"
# vendor/gpui_linux is a local `[patch.crates-io]` override for the published bezel-gpui-linux
# (F-CORE-FILE-03A), not a workspace member -- it carries its own `[workspace]` table so
# `cargo test --manifest-path rust/vendor/gpui_linux/Cargo.toml` can run its tests standalone;
# excluded here so `cargo build/test --workspace` does not also try to treat it as a member
# (which conflicts with its own `[workspace]` table).
exclude = ["vendor/gpui_linux", "vendor/gpui_windows"]
members = [
    "crates/sirio",
    "crates/sirio_theme",
    "crates/sirio_ui",
    "crates/sirio_terminal",
    "crates/sirio_acp",
    "crates/sirio_project",
    "crates/sirio_git",
    "crates/sirio_persistence",
    "crates/sirio_agents",
    "crates/sirio_control",
    "crates/sirio_activity",
    "crates/sirio_markdown",
    "crates/sirio_usage",
    "crates/sirio_registry",
    "crates/sirio_release",
    "crates/sirio_update",
    "crates/sirio_apply",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
publish = false

[workspace.dependencies]
# GPUI used to be an absolute path into a zed checkout on one particular Mac, which meant the
# workspace failed to resolve — not to build, to *resolve* — anywhere else, taking all thirteen
# crates down with it even though only four of them touch GPUI. Now that Sirio targets Linux as
# well, a pinned git rev is the only form that works on both machines with no local checkout.
# Bump the rev deliberately: it is the single knob that moves the GPUI API under the whole UI.
# gpui's own defaults are ["font-kit", "wayland", "x11", "windows-manifest"], so
# `default-features = false` silently removed the two that decide whether this program can put a
# window on a Linux screen. gpui::guess_compositor() is compiled against *gpui's* features, not
# gpui_platform's: with them off it reads neither $DISPLAY nor $WAYLAND_DISPLAY, returns
# "Headless", and the app runs a perfectly healthy event loop forever without a window. It
# compiles, starts, logs, exits cleanly — and renders nothing.
#
# "wayland" and "x11" are Linux-only windowing backends -- meaningless on macOS/Windows, whose
# own backends live in gpui_macos and inside gpui_platform's own
# `[target.'cfg(target_os = "windows")']` section -- so a workspace dependency (which cannot
# itself be target-conditional; Cargo has no `[target...workspace.dependencies]` table) cannot
# pin them unconditionally without breaking non-Linux resolution. They are re-added, Linux-only,
# by every crate that depends on gpui/gpui_platform, via a `[target.'cfg(target_os = "linux")'.
# dependencies]` section of the form `gpui = { workspace = true, features = ["wayland", "x11"] }`
# -- Cargo unifies features requested for the same dependency across a package's unconditional
# and target-specific dependency tables (verified: a `[dependencies]` entry with
# `default-features = false` plus a `[target.cfg(...).dependencies]` entry adding a feature for
# the *same* crate does turn that feature on for matching targets), so this is additive, not a
# second declaration. Net effect for `x86_64-unknown-linux-gnu`: byte-for-byte the same feature
# set as before this change. gpui_platform below must enable its own wayland/x11 copies the same
# way, since they are separate switches from gpui's.
gpui = { package = "bezel-gpui", version = "=0.3.8", default-features = false }
# "font-kit" is not Linux-specific (unlike wayland/x11 above) so it stays unconditional here,
# matching gpui_platform's pre-portability-wave feature set on every platform.
gpui_platform = { package = "bezel-gpui-platform", version = "=0.3.8", default-features = false, features = ["font-kit"] }
# Geist is the face on every platform now (B3), and `geist-weights` is not
# optional decoration: gpui's cosmic-text path rasterizes a variable font at its
# default instance only, so without the 500/600/700 statics the Linux build
# cannot paint semibold or bold and nothing reports it.
bezel = { version = "=0.1.4", default-features = false, features = [
    "geist-sans",
    "geist-mono",
    "geist-weights",
] }
bezel-markdown = "=0.1.4"
bezel-editor = "=0.1.4"
bezel-syntax = "=0.1.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"

sirio_theme = { path = "crates/sirio_theme" }
sirio_ui = { path = "crates/sirio_ui" }
sirio_terminal = { path = "crates/sirio_terminal" }
sirio_acp = { path = "crates/sirio_acp" }
sirio_project = { path = "crates/sirio_project" }
sirio_git = { path = "crates/sirio_git" }
sirio_persistence = { path = "crates/sirio_persistence" }
sirio_agents = { path = "crates/sirio_agents" }
sirio_control = { path = "crates/sirio_control" }
sirio_activity = { path = "crates/sirio_activity" }
sirio_markdown = { path = "crates/sirio_markdown" }
sirio_usage = { path = "crates/sirio_usage" }
sirio_registry = { path = "crates/sirio_registry" }
sirio_release = { path = "crates/sirio_release" }
sirio_update = { path = "crates/sirio_update" }
sirio_apply = { path = "crates/sirio_apply" }

# Local override for F-CORE-FILE-03A: upstream `gpui_linux`'s wl_data_device `Drop` handler
# bails out silently (no `finish()`/`destroy()`, no error, no event delivered to the app) when
# the async `Enter` pipe-read that resolves the dragged paths has not yet completed -- which a
# provider slower than ~150ms reliably triggers, discarding a real XDND drop with no trace. See
# rust/vendor/README.md and docs/linux-rewrite/tasks/P133-gpui-xdnd-slow-provider-race.md.
#
# `[patch.crates-io]` (not the git-URL form the comment here once described) because
# gpui/gpui_platform now resolve `bezel-gpui-linux` from crates.io, not from a zed git rev.
# `gpui_platform` is not patched alongside it: the published `bezel-gpui-platform` takes its own
# `gpui_linux` dependency as a plain crates.io registry dependency (`package = "bezel-gpui-linux"`,
# not a path dependency), so this one entry is enough for `[patch.crates-io]` to substitute the
# vendored tree for every consumer, `bezel-gpui-platform` included -- verified against
# `bezel-gpui-platform`'s published manifest. See rust/vendor/README.md for the full arrangement.
[patch.crates-io]
bezel-gpui-linux = { path = "vendor/gpui_linux" }
# Local override for Windows translucency: upstream `gpui_windows`'s no-DirectComposition path
# (the one Sirio forces via GPUI_DISABLE_DIRECT_COMPOSITION so the WebView2 child HWND paints,
# ADR 0002) creates a flip-model HWND swap chain, which the DWM composes as opaque, so
# `WindowBackgroundAppearance::Blurred` could never show anything behind the window. The vendored
# copy presents through a bitblt swap chain instead; its alpha reaches the redirection surface and
# the acrylic accent policy shows through. One function changed; see rust/vendor/README.md.
bezel-gpui-windows = { path = "vendor/gpui_windows" }

[profile.dev]
# Keep dev links and debug-info I/O light; remove this line when full debug info is needed.
debug = "line-tables-only"
split-debuginfo = "unpacked"
