[workspace]
resolver = "2"
# vendor/gpui_linux, vendor/gpui_windows, vendor/gpui_macos and vendor/bezel_theme are local `[patch.crates-io]`
# overrides (see ../vendor/README.md), not workspace members -- each carries its own `[workspace]`
# table so `cargo test --manifest-path vendor/<crate>/Cargo.toml` can run its tests standalone;
# excluded here so `cargo build/test --workspace` does not also try to treat them as members
# (which conflicts with their own `[workspace]` tables).
exclude = ["vendor/gpui_linux", "vendor/gpui_windows", "vendor/gpui_macos", "vendor/bezel_theme", "vendor/pulldown-cmark"]
members = [
    "vendor/ely-palette",
    "vendor/ely-gpui-component",
    "vendor/ely/crates/ely-core",
    "vendor/ely/crates/ely-chat",
    "vendor/ely/crates/ely-agent",
    "vendor/ely/crates/ely-editor",
    "vendor/ely/crates/ely-git",
    "vendor/ely/crates/ely-documents",
    "vendor/ely/crates/ely-collab",
    "vendor/ely/crates/ely-charts",
    "vendor/reqwest_client",
    "crates/sirio_perf",
    "crates/sirio_env",
    "crates/sirio",
    "crates/sirio_theme",
    "crates/sirio_ui",
    "crates/sirio_term_session",
    "crates/sirio_terminal",
    "crates/sirio_chat_vocab",
    "crates/sirio_chat_child",
    "crates/sirio_acp",
    "crates/sirio_chat",
    "crates/sirio_claude",
    "crates/sirio_lsp",
    "crates/sirio_project",
    "crates/sirio_icons",
    "crates/sirio_git",
    "crates/sirio_persistence",
    "crates/sirio_agents",
    "crates/sirio_control",
    "crates/sirio_ipc",
    "crates/sirio_activity",
    "crates/sirio_opencode_watch",
    "crates/sirio_markdown",
    "crates/sirio_diagram",
    "crates/sirio_usage",
    "crates/sirio_registry",
    "crates/sirio_syntax",
    "crates/sirio_release",
    "crates/sirio_update",
    "crates/sirio_apply",
    "crates/sirio_forge",
    "crates/sirio_privacy",
    "crates/sirio_host_client",
    "crates/sirio_host_protocol",
    "crates/sirio_host",
    "crates/sirio_ide",
    "crates/sirio_mcp_apps",
]

[workspace.package]
version = "0.47.1"
edition = "2024"
publish = false

[workspace.dependencies]
ely-palette = { path = "vendor/ely-palette" }
ely-gpui-component = { path = "vendor/ely-gpui-component", default-features = false, features = ["sirio-chat"] }
ely-core = { path = "vendor/ely/crates/ely-core", version = "0.3.0", default-features = false }
ely-chat = { path = "vendor/ely/crates/ely-chat", version = "0.2.0" }
ely-agent = { path = "vendor/ely/crates/ely-agent", version = "0.2.0" }
ely-editor = { path = "vendor/ely/crates/ely-editor", version = "0.2.0" }
ely-git = { path = "vendor/ely/crates/ely-git", version = "0.2.0" }
ely-documents = { path = "vendor/ely/crates/ely-documents", version = "0.2.0" }
ely-collab = { path = "vendor/ely/crates/ely-collab", version = "0.2.0" }
ely-charts = { path = "vendor/ely/crates/ely-charts", version = "0.2.0" }
# GPUI used to be an absolute path into a zed checkout on one particular Mac, which meant the
# workspace failed to resolve — not to build, to *resolve* — anywhere else, taking all thirteen
# crates down with it even though only four of them touch GPUI. Now that Sirio targets Linux as
# well, a pinned git rev is the only form that works on both machines with no local checkout.
# Bump the rev deliberately: it is the single knob that moves the GPUI API under the whole UI.
# gpui's own defaults are ["font-kit", "wayland", "x11", "windows-manifest"], so
# `default-features = false` silently removed the two that decide whether this program can put a
# window on a Linux screen. gpui::guess_compositor() is compiled against *gpui's* features, not
# gpui_platform's: with them off it reads neither $DISPLAY nor $WAYLAND_DISPLAY, returns
# "Headless", and the app runs a perfectly healthy event loop forever without a window. It
# compiles, starts, logs, exits cleanly — and renders nothing.
#
# "wayland" and "x11" are Linux-only windowing backends -- meaningless on macOS/Windows, whose
# own backends live in gpui_macos and inside gpui_platform's own
# `[target.'cfg(target_os = "windows")']` section -- so a workspace dependency (which cannot
# itself be target-conditional; Cargo has no `[target...workspace.dependencies]` table) cannot
# pin them unconditionally without breaking non-Linux resolution. They are re-added, Linux-only,
# by every crate that depends on gpui/gpui_platform, via a `[target.'cfg(target_os = "linux")'.
# dependencies]` section of the form `gpui = { workspace = true, features = ["wayland", "x11"] }`
# -- Cargo unifies features requested for the same dependency across a package's unconditional
# and target-specific dependency tables (verified: a `[dependencies]` entry with
# `default-features = false` plus a `[target.cfg(...).dependencies]` entry adding a feature for
# the *same* crate does turn that feature on for matching targets), so this is additive, not a
# second declaration. Net effect for `x86_64-unknown-linux-gnu`: byte-for-byte the same feature
# set as before this change. gpui_platform below must enable its own wayland/x11 copies the same
# way, since they are separate switches from gpui's.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
# "font-kit" is not Linux-specific (unlike wayland/x11 above) so it stays unconditional here,
# matching gpui_platform's pre-portability-wave feature set on every platform.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit"] }
# The HTTP client every Application of this program installs (sirio_ui::app_platform). gpui-pre
# ships no default client, so the one the previous engine installed is vendored here.
reqwest_client = { path = "vendor/reqwest_client", package = "sirio-reqwest-client" }
# Renamed: each package's lib target is a bare word (`theme`, `syntax`), so the
# extern name carries the `bezel_` prefix and a path reads `bezel_theme::…`, `bezel_syntax::…`. Cf. `gpui = { package = "gpui-pre" }` above.
bezel_theme = { version = "=0.1.4", package = "bezel-theme" }
bezel_syntax = { version = "=0.1.4", package = "bezel-syntax" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
# The filesystem watcher behind the Files panel's refresh conditions.
# Declared here rather than per crate so `sirio` and `sirio_ui` cannot
# drift onto two versions of the same watcher.
notify = "8"

sirio_theme = { path = "crates/sirio_theme" }
sirio_ui = { path = "crates/sirio_ui" }
sirio_terminal = { path = "crates/sirio_terminal" }
sirio_acp = { path = "crates/sirio_acp" }
sirio_chat = { path = "crates/sirio_chat" }
sirio_project = { path = "crates/sirio_project" }
sirio_icons = { path = "crates/sirio_icons" }
sirio_git = { path = "crates/sirio_git" }
sirio_persistence = { path = "crates/sirio_persistence" }
sirio_agents = { path = "crates/sirio_agents" }
sirio_control = { path = "crates/sirio_control" }
sirio_activity = { path = "crates/sirio_activity" }
sirio_markdown = { path = "crates/sirio_markdown" }
sirio_diagram = { path = "crates/sirio_diagram" }
sirio_usage = { path = "crates/sirio_usage" }
sirio_registry = { path = "crates/sirio_registry" }
sirio_syntax = { path = "crates/sirio_syntax" }
sirio_release = { path = "crates/sirio_release" }
sirio_update = { path = "crates/sirio_update" }
sirio_apply = { path = "crates/sirio_apply" }
sirio_forge = { path = "crates/sirio_forge" }
sirio_privacy = { path = "crates/sirio_privacy" }
sirio_ide = { path = "crates/sirio_ide" }
socket2 = "0.6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# Local override for F-CORE-FILE-03A: upstream `gpui_linux`'s wl_data_device `Drop` handler
# bails out silently (no `finish()`/`destroy()`, no error, no event delivered to the app) when
# the async `Enter` pipe-read that resolves the dragged paths has not yet completed -- which a
# provider slower than ~150ms reliably triggers, discarding a real XDND drop with no trace. See
# rust/vendor/README.md.
#
# `[patch.crates-io]` because gpui/gpui_platform resolve `gpui-pre-linux` from crates.io. The
# published `gpui-pre-platform` takes `gpui-pre-linux` as an ordinary registry dependency, so this
# one entry substitutes the vendored tree for every consumer. See rust/vendor/README.md.
[patch.crates-io]
# Upstream Ely's patched pulldown-cmark 0.13.6, taken verbatim (L7 in rust/vendor/ely/LOCAL-CHANGES.md).
pulldown-cmark = { path = "vendor/pulldown-cmark" }
gpui-pre-linux = { path = "vendor/gpui_linux" }
# Local override for Windows translucency: upstream `gpui_windows`'s no-DirectComposition path
# (the one Sirio forces via GPUI_DISABLE_DIRECT_COMPOSITION so the WebView2 child HWND paints,
# ADR 0003, Context) creates a flip-model HWND swap chain, which the DWM composes as opaque, so
# `WindowBackgroundAppearance::Blurred` could never show anything behind the window. The vendored
# copy presents through a bitblt swap chain instead, and keeps additive alpha blending; see
# rust/vendor/README.md.
gpui-pre-windows = { path = "vendor/gpui_windows" }
# Local override for #810: on macOS 14 and later upstream `gpui_macos` paces each window with a
# CAMetalDisplayLink. A window in the background sometimes drew its next frame about 10 s late, and
# a paused link is the suspected cause (unconfirmed on a Mac). The vendored copy, Ely's at
# 0b983008, paces every window with CVDisplayLink, as gpui-pre 0.3.10 and bezel-gpui 0.3.8 did;
# see rust/vendor/README.md.
gpui-pre-macos = { path = "vendor/gpui_macos" }
# `bezel-theme` 0.1.4 on gpui-pre: the published crate depends on `bezel-gpui`, the engine this
# workspace used to build. The vendored copy changes only that dependency.
bezel-theme = { path = "vendor/bezel_theme" }

[profile.dev]
# Keep dev links and debug-info I/O light; remove this line when full debug info is needed.
debug = "line-tables-only"
split-debuginfo = "unpacked"
