# Local override of the published `bezel-gpui-linux` crate (Bezel GPUI family, release 0.3.6),
# substituted in via the `[patch.crates-io]` section of ../../Cargo.toml. See ../README.md for
# what changed and why, and docs/linux-rewrite/tasks/P133-gpui-xdnd-slow-provider-race.md for the
# upstream defect this fixes (F-CORE-FILE-03A). Everything below mirrors the released manifest
# field-for-field except two deliberate differences: `[package] name` is `bezel-gpui-linux`, not
# `gpui_linux`, so this path matches the crates.io package name the `[patch.crates-io]` entry
# targets; `[lib] name` stays `gpui_linux` so it keeps resolving as the same import path every
# consumer already uses. Dependencies that the released manifest expresses as `.workspace = true`
# (resolving against zed's own root workspace, which does not exist here) are written out as the
# literal registry dependency they resolve to instead.

[workspace]

[package]
name = "bezel-gpui-linux"
version = "0.3.6"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata.cargo-shear]
ignored = ["bitflags", "scap", "x11-clipboard"]

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0

[lib]
name = "gpui_linux"
path = "src/gpui_linux.rs"

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = [
    "bitflags",
    "gpui_wgpu",
    "ashpd/wayland",

    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "gpui/wayland",
]
x11 = [
    "gpui_wgpu",
    "ashpd",

    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = [
    "gpui/screen-capture",
    "scap",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = "0.21.0"
anyhow = "1.0.86"
bytemuck = "1"
collections = { package = "bezel-zed-collections", version = "0.3.6" }
futures = "0.3.32"
gpui = { package = "bezel-gpui", version = "0.3.6", default-features = false }
gpui_util = { package = "bezel-gpui-util", version = "0.3.6" }
gpui_wgpu = { package = "bezel-gpui-wgpu", version = "0.3.6", optional = true, features = ["font-kit"] }
http_client = { package = "bezel-zed-http-client", version = "0.3.6" }
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
strum = { version = "0.27.2", features = ["derive"] }
url = "2.2"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

# Always used
oo7 = { version = "0.6", default-features = false, features = [
    "async-std",
    "native_crypto",
] }
calloop = "0.14.3"
notify-rust = "4"
raw-window-handle = "0.6"

# Used in both windowing options
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "notification",
    "open_uri",
    "file_chooser",
    "settings",
    "trash",
], optional = true }
bitflags = { version = "2.6.0", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { version = "0.8.0", default-features = false, optional = true }

# Screen capture
scap = { package = "zed-scap", version = "0.0.8-zed", default-features = false, optional = true }

# Wayland
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.15", features = [
    "client_system",
    "dlopen",
], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = [
    "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = [
    "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
], optional = true }
xim = { package = "zed-xim", version = "0.4.0-zed", features = [
    "x11rb-xcb",
    "x11rb-client",
], optional = true }
x11-clipboard = { version = "0.9.3", optional = true }
