[package]
name = "ely-gpui-component"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Sirio's one name for Ely: a facade over the upstream ely crates vendored under vendor/ely."

[features]
default = ["sirio-chat"]
sirio-chat = []
# For runs by hand only: it turns on gpui's leak detection, so no Sirio manifest enables it.
test-support = [
    "ely-core/test-support",
    "ely-chat/test-support",
    "ely-agent/test-support",
    "ely-editor/test-support",
    "ely-git/test-support",
]

[dependencies]
ely-core.workspace = true
ely-chat.workspace = true
ely-agent.workspace = true
ely-editor.workspace = true
ely-git.workspace = true
gpui.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
