[package]
name = "ely-core"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Ely's core for GPUI: theme, motion, primitives, typography, layout, shell, controls, overlays, lists and tables."
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"
homepage = "https://elygpui.com"
readme = "README.md"
keywords = ["gpui", "ui", "components", "widgets", "gui"]
categories = ["gui"]

[features]
default = []
fonts = []
platform = ["dep:gpui_platform"]
runtime_shaders = ["platform", "gpui_platform/runtime_shaders"]
test-support = ["gpui/test-support", "gpui/leak-detection"]

[dependencies]
anyhow = "1"
barcoders = { version = "2", default-features = false, features = ["std"] }
emojis = "0.9"
futures = "0.3"
gpui = { workspace = true, features = ["stacker"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"], optional = true }
image = { version = "0.25", default-features = false }
iso_currency = "0.7"
isocountry = "0.3"
jiff = "0.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
unicode-segmentation = "1"
web-time = "1.1"

[target.'cfg(target_family = "wasm")'.dependencies]
jiff = { version = "0.2", features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSButton",
    "NSColor",
    "NSColorSampler",
    "NSColorSpace",
    "NSControl",
    "NSResponder",
    "NSSharingService",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
