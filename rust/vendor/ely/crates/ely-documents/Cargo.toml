[package]
name = "ely-documents"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Ely's document components for GPUI: Markdown read and written, block editing, math, diagrams and reading aids."
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"
homepage = "https://elygpui.com"
readme = "README.md"
keywords = ["gpui", "ui", "components", "widgets", "gui"]
categories = ["gui"]

[features]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-core.workspace = true
ely-editor.workspace = true
base64 = "0.22"
emojis = "0.9"
entities = "1"
gpui.workspace = true
image = { version = "0.25", default-features = false }
jiff = "0.2"
log = "0.4"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
html5ever = "0.39"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
regex = "1"
similar = { version = "3.2", default-features = false, features = ["std", "text", "inline", "unicode"] }
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
usvg = "0.46"
web-time = "1.1"

[target.'cfg(target_family = "wasm")'.dependencies]
similar = { version = "3.2", default-features = false, features = ["wasm32_web_time"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
