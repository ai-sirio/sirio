# Local override of zed-industries/zed's `gpui_platform` crate (pinned rev
# c05e34637b4f7f100a688bf6ac71cb70877fc8ad), substituted in via the `[patch]` section of
# ../../Cargo.toml purely so its Linux dependency resolves to the sibling patched `gpui_linux`
# in this directory instead of the upstream one -- gpui_platform's own `gpui_linux.workspace =
# true` is a *path* dependency inside the zed checkout (a different Cargo SourceId than the git
# URL), so patching `gpui_linux` alone would not reach it. This crate's own code is untouched;
# only the dependency line below differs from upstream. See ../README.md and
# docs/linux-rewrite/tasks/P133-gpui-xdnd-slow-provider-race.md (F-CORE-FILE-03A).

[workspace]

[package]
name = "gpui_platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
font-kit = ["gpui_macos/font-kit"]
test-support = ["gpui/test-support", "gpui_macos/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", package = "gpui_macos", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", package = "gpui_windows", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", default-features = false, features = ["windows-manifest"] }

# The one line that differs from upstream: a relative path to the sibling patched crate in this
# same vendor directory, not `{ git = ..., package = "gpui_linux" }` -- see the module comment.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux = { path = "../gpui_linux", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "c05e34637b4f7f100a688bf6ac71cb70877fc8ad", package = "gpui_web" }
console_error_panic_hook = "0.1.7"
